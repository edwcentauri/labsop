<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="实验室标准操作流程、在线计算工具与 PDF 文件中心" />
    <meta property="og:title" content="Lab SOP · 实验室操作中心" />
    <meta property="og:description" content="实验室标准操作流程、在线计算工具与 PDF 文件中心" />
    <meta property="og:type" content="website" />
    <title>Lab SOP · 实验室操作中心</title>
  </head>
  <body>
    <script>
      (() => {
        const saved = localStorage.getItem('labsop:theme');
        const preference = ['light', 'dark', 'auto'].includes(saved) ? saved : 'auto';
        const theme = preference === 'auto'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1716' : '#0f766e';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
